name: Stoa
options:
  bundleIdPrefix: com.sam.stoa
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon2
packages:
  EPUBKit:
    url: https://github.com/witekbobrowski/EPUBKit
    from: "0.2.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
targets:
  Stoa:
    type: application
    platform: macOS
    sources:
      - path: Sources/Stoa
    info:
      path: Sources/Stoa/App/Info.plist
      properties:
        CFBundleDisplayName: Stoa
        CFBundleIconName: AppIcon2
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Personal use"
        NSDocumentsFolderUsageDescription: "Stoa scans your Documents folder to find EPUB, PDF, and CBZ books to add to your library."
        NSDesktopFolderUsageDescription: "Stoa scans your Desktop folder to find EPUB, PDF, and CBZ books to add to your library."
        NSDownloadsFolderUsageDescription: "Stoa scans your Downloads folder to find EPUB, PDF, and CBZ books to add to your library."
        NSRemovableVolumesUsageDescription: "Stoa can look for books on connected drives you choose to add."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        DEVELOPMENT_TEAM: W3YMY5PN2X
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon2
    entitlements:
      path: Sources/Stoa/App/Stoa.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: EPUBKit
      - package: ZIPFoundation
    scheme:
      testTargets: []
      gatherCoverageData: false
