name: Athenaeum
options:
  bundleIdPrefix: com.sam.athenaeum
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Hardened Runtime is required for notarization (Product > Archive >
    # Distribute App > Direct Distribution). Nothing in Athenaeum needs an
    # exception entitlement for it — no JIT, no unsigned dylibs, no
    # debugging hooks — so this can just be on.
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon2
packages:
  EPUBKit:
    url: https://github.com/witekbobrowski/EPUBKit
    from: "0.2.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
targets:
  Athenaeum:
    type: application
    platform: macOS
    sources:
      - path: Sources/Athenaeum
    info:
      path: Sources/Athenaeum/App/Info.plist
      properties:
        CFBundleDisplayName: Athenaeum
        CFBundleIconName: AppIcon2
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026"
        NSDocumentsFolderUsageDescription: "Athenaeum scans your Documents folder to find EPUB, PDF, and CBZ books to add to your library."
        NSDesktopFolderUsageDescription: "Athenaeum scans your Desktop folder to find EPUB, PDF, and CBZ books to add to your library."
        NSDownloadsFolderUsageDescription: "Athenaeum scans your Downloads folder to find EPUB, PDF, and CBZ books to add to your library."
        NSRemovableVolumesUsageDescription: "Athenaeum can look for books on connected drives you choose to add."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        DEVELOPMENT_TEAM: W3YMY5PN2X
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon2
    entitlements:
      path: Sources/Athenaeum/App/Athenaeum.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: EPUBKit
      - package: ZIPFoundation
    scheme:
      testTargets:
        - AthenaeumTests
      gatherCoverageData: false

  AthenaeumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AthenaeumTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: Athenaeum
